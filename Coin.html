<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<title>Coin Toss</title><style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #1e1e1e;
  color: white;
  flex-direction: column;
}

h1 {
  margin-bottom: 20px;
}

.coin {
  width: 150px;
  height: 150px;
  border-radius: 50%;
  background: gold;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 2rem;
  font-weight: bold;
  color: black;
  box-shadow: 0 0 20px rgba(255,215,0,0.6);
  transition: transform 0.6s;
}

#result {
  margin-top: 20px;
  font-size: 1.5rem;
}
</style></head><body><h1>Coin Toss</h1><div class="coin" id="coin">?</div><div id="result">Tap anywhere to flip</div><script>
document.addEventListener("touchstart", flipCoin);
document.addEventListener("mousedown", flipCoin);

function flipCoin(e) {
  const coin = document.getElementById("coin");
  const result = document.getElementById("result");

  let y;

  if (e.touches) {
    y = e.touches[0].clientY;
  } else {
    y = e.clientY;
  }

  let choice = (y < window.innerHeight / 2) ? "HEAD" : "TAILS";

  // Animation
  coin.style.transform = "rotateY(720deg)";

  setTimeout(() => {
    coin.innerText = choice === "HEAD" ? "H" : "T";
    result.innerText = "Result: " + choice;
    coin.style.transform = "rotateY(0deg)";
  }, 600);
}
</script></body>
</html>
